name: wervexa_customer
description: "Wervexa Customer — find and book skilled home service professionals."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Identity. Firebase Authentication is the only auth provider on the platform.
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  # Push notifications.
  firebase_messaging: ^15.1.5
  # Crash reporting.
  firebase_crashlytics: ^4.1.5

  # Business data, Realtime. Not auth, not storage.
  supabase_flutter: ^2.8.1

  # Presentation and state.
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1

  # Maps — Google Maps SDK. Requires MAPS_API_KEY configured in
  # android/local.properties (see build.gradle.kts) — never hardcoded here.
  google_maps_flutter: ^2.18.0

  # Location.
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  permission_handler: ^11.3.1

  # Image capture / picking.
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  file_picker: ^8.1.6

  # Platform and utility.
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  package_info_plus: ^8.1.1
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.18.0
  path: ^1.9.0
  http: ^1.2.2
  google_fonts: ^6.2.1
  razorpay_flutter: ^1.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
