org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Workaround: Kotlin incremental compilation fails when the project (D:) and
# Pub cache (C:) are on different Windows drive roots — the compiler cannot
# compute relative paths across roots and hangs.
kotlin.incremental=false
